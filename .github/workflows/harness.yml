name: First harness experiment
on:
  pull_request:
    paths:
      - 'experiments/harness/**'
      - 'experiments/inference-boundary/**'
      - 'experiments/native-evaluation/**'
      - 'experiments/router-authority-extension/overlay/**'
      - 'experiments/isolation/**'
      - 'tests/fixtures/harness/**'
      - '.github/workflows/harness.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/harness/**'
      - 'experiments/inference-boundary/**'
      - 'experiments/native-evaluation/**'
      - 'experiments/router-authority-extension/overlay/**'
      - 'experiments/isolation/**'
      - 'tests/fixtures/harness/**'
      - '.github/workflows/harness.yml'
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/harness/package-lock.json
      - run: npm ci --prefix experiments/harness --ignore-scripts
      - run: npm --prefix experiments/harness run check
      - run: npm --prefix experiments/harness test
      - run: npm --prefix experiments/harness run check:native
      - run: npm --prefix experiments/harness run test:native
