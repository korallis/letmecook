name: Router status experiment
on:
  pull_request:
    paths:
      - 'experiments/router-status/**'
      - 'tests/fixtures/9router/**'
      - '.github/workflows/router-status.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/router-status/**'
      - 'tests/fixtures/9router/**'
      - '.github/workflows/router-status.yml'
permissions:
  contents: read
jobs:
  status-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/router-status/package-lock.json
      - run: npm --prefix experiments/router-status ci --ignore-scripts
      - run: npm --prefix tests/fixtures/9router ci --ignore-scripts
      - run: npm --prefix tests/fixtures/9router test
      - run: npm --prefix experiments/router-status run check
      - run: npm --prefix experiments/router-status test
