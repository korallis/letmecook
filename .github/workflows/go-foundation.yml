name: Provisional Go workflow store
on:
  push:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'cmd/**', 'internal/**', 'schemas/**', 'web/**', 'tests/fixtures/protocol/**', 'tests/fixtures/readapi/**', 'experiments/inference-boundary/json.ts', 'experiments/inference-boundary/package*.json', '.github/workflows/go-foundation.yml']
  pull_request:
    paths: ['go.mod', 'go.sum', 'cmd/**', 'internal/**', 'schemas/**', 'web/**', 'tests/fixtures/protocol/**', 'tests/fixtures/readapi/**', 'experiments/inference-boundary/json.ts', 'experiments/inference-boundary/package*.json', '.github/workflows/go-foundation.yml']
permissions:
  contents: read
jobs:
  workflow-store:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/inference-boundary/package-lock.json
      - run: go mod verify
      - run: npm --prefix experiments/inference-boundary ci --ignore-scripts
      - name: Embedded shell build
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
      - name: Format and types
        run: |
          test -z "$(gofmt -l cmd internal schemas web tests/fixtures/protocol)"
          experiments/inference-boundary/node_modules/.bin/tsc --noEmit --strict --target es2023 --module nodenext --allowImportingTsExtensions schemas/execution/protocol.ts schemas/readapi/types.ts tests/fixtures/protocol/check.ts tests/fixtures/readapi/check.ts --typeRoots experiments/inference-boundary/node_modules/@types
          go vet ./...
      - name: Reproducible CGO-free build
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gafferd-a" ./cmd/gafferd
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gafferd-b" ./cmd/gafferd
          cmp "$RUNNER_TEMP/gafferd-a" "$RUNNER_TEMP/gafferd-b"
      - name: Real store and daemon crash, migration and ownership tests
        run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go test -count=1 ./...
      - run: node tests/fixtures/protocol/check.ts
      - run: node tests/fixtures/readapi/check.ts
