name: Planner probe
on:
  pull_request:
    paths:
      - 'experiments/planner-probe/**'
      - 'experiments/inference-boundary/**'
      - 'tests/fixtures/planner/**'
      - '.github/workflows/planner-probe.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/planner-probe/**'
      - 'experiments/inference-boundary/**'
      - 'tests/fixtures/planner/**'
      - '.github/workflows/planner-probe.yml'
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/planner-probe/package-lock.json
      - run: npm ci --prefix experiments/planner-probe
      - run: npm --prefix experiments/planner-probe run check
      - run: npm --prefix experiments/planner-probe test
      - run: node experiments/planner-probe/prove.ts /tmp/planner-probe-run.json
      - name: Retain the redacted proof even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planner-proof-${{ github.sha }}
          path: /tmp/planner-probe-run.json
          if-no-files-found: warn
          retention-days: 14
