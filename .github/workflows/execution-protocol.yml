name: Provisional execution protocol
on:
  push:
    branches: [main]
    paths: ['go.mod', 'schemas/execution/**', 'tests/fixtures/protocol/**', 'experiments/inference-boundary/json.ts', 'experiments/inference-boundary/package*.json', '.github/workflows/execution-protocol.yml']
  pull_request:
    paths: ['go.mod', 'schemas/execution/**', 'tests/fixtures/protocol/**', 'experiments/inference-boundary/json.ts', 'experiments/inference-boundary/package*.json', '.github/workflows/execution-protocol.yml']
permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/inference-boundary/package-lock.json
      - run: npm --prefix experiments/inference-boundary ci --ignore-scripts
      - name: Strict TypeScript types
        run: experiments/inference-boundary/node_modules/.bin/tsc --noEmit --strict --target es2023 --module nodenext --allowImportingTsExtensions schemas/execution/protocol.ts tests/fixtures/protocol/check.ts --typeRoots experiments/inference-boundary/node_modules/@types
      - name: Go formatting
        run: test -z "$(gofmt -l schemas/execution tests/fixtures/protocol)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: node tests/fixtures/protocol/check.ts
