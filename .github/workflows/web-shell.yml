name: Provisional embedded shell
on:
  push:
    branches: [main]
    paths: ['web/**', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'schemas/**', 'experiments/inference-boundary/json.ts', '.github/workflows/web-shell.yml']
  pull_request:
    paths: ['web/**', 'go.mod', 'go.sum', 'cmd/**', 'internal/**', 'schemas/**', 'experiments/inference-boundary/json.ts', '.github/workflows/web-shell.yml']
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run typecheck
      - name: React Doctor (telemetry off, errors block)
        run: npm --prefix web run doctor
      - name: Reproducible shell build
        run: |
          npm --prefix web run build
          (cd web/dist && find . -type f | sort | xargs shasum -a 256) > "$RUNNER_TEMP/dist-a"
          rm -rf web/dist/assets web/dist/index.html
          npm --prefix web run build
          (cd web/dist && find . -type f | sort | xargs shasum -a 256) > "$RUNNER_TEMP/dist-b"
          cmp "$RUNNER_TEMP/dist-a" "$RUNNER_TEMP/dist-b"
      - name: Embedded shell served by daemon
        run: go test -count=1 -run 'TestEmbeddedShell|TestAssetPaths' -v ./internal/httpapi/ ./web/
      - run: npm --prefix web exec playwright install --with-deps chromium
      - name: Rendered UI/API integration, axe and screenshots
        run: npm --prefix web test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-shell-reports
          path: |
            web/reports/react-doctor.json
            web/reports/playwright.json
            web/reports/screenshots
          if-no-files-found: error
